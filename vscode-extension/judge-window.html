<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>编程网格 · 测试与提交</title>
  <link rel="stylesheet" href="media/sidepanel.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="vscode-controls"><button id="closeCoach">收起</button></div>
  <main>
    <section id="priorityPanel" class="priority-panel" aria-live="polite">
      <div id="priorityVerdict" class="priority-verdict" hidden></div>
      <div id="priorityLabel" class="priority-label">编程网格原文</div>
      <pre id="priorityRaw">点击下方“测试代码”或“正式提交”，这里会优先显示网站返回。</pre>
    </section>
    <div class="judge-actions">
      <button id="gridTest" class="primary">测试代码 · 网格判题</button>
      <button id="submitOJ">正式提交到编程网格</button>
    </div>
    <details id="manualTestOptions">
      <summary id="testModeSummary">测试方式：网格判题（默认）｜手工输入</summary>
      <label><input id="useManualInput" type="checkbox">改用手工输入测试，自行核对输出</label>
      <textarea id="webTestInput" rows="5" maxlength="20000" spellcheck="false" disabled placeholder="启用手工输入后发送这段输入"></textarea>
    </details>
    <section id="webTestPanel" class="execution-panel" hidden>
      <h3 id="testPanelTitle">测试代码 · 网格判题</h3>
      <p id="webTestState" role="status"></p>
      <button id="refreshGridTest">刷新本次结果</button>
      <div id="webTestResults"></div>
    </section>
    <section id="ojPanel" class="execution-panel" hidden>
      <h3>云端评测 · 平台测试集</h3>
      <p id="ojState" role="status"></p>
      <button id="refreshOJ">刷新本次结果</button>
      <div id="ojResults"></div>
    </section>
  </main>
  <footer class="coach-footer">
    <button id="judgeSettings">设置判定文字、字号与颜色</button>
    <details>
      <summary>题目连接与本机记录</summary>
      <button id="bindProblem">关联/更换题目</button>
      <button id="showRecords">打开本机记录</button>
    </details>
    <p>“测试代码”默认使用网页测试按钮的空输入模式，显示网格判定和逐用例反馈。勾选手工输入后，输出由你自行核对。“正式提交”保留为独立操作。</p>
    <p>AI 提示与交流在单独的页面。</p>
    <p>刷新只查询本次编号，不会再次发送代码。</p>
    <p>重新打开时只显示上次记录，不自动查询。</p>
  </footer>
  <script src="webview-adapter.js"></script>
  <script src="judge-controls.js"></script>
</body>
</html>
