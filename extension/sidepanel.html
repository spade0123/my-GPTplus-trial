<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>C++ 学习教练</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><link rel="stylesheet" href="sidepanel.css"></head>
<body><header><span class="eyebrow">C++ 学习教练 · 独立侧栏</span><h1>边写，边理解</h1><p>点击时读取当前题目与代码，记录保存到本机文件。</p></header>
<nav aria-label="学习工具"><button id="quickSave" class="primary">快捷保存</button><button id="hint">提示</button><button id="discussion">交流</button></nav>
<p id="saveStatus" class="status" role="status" aria-live="polite">打开题目后，点击按钮即可使用。</p><p id="context" class="context"></p>
<section id="hintPanel" hidden><h2>当前代码提示</h2><p id="hintState" class="status" aria-live="polite"></p><article id="hintAnswer" class="markdown"></article></section>
<section id="chatPanel" hidden><h2>结合代码交流</h2><p class="muted">每次发送都会重新读取并保存当前完整代码。可在编辑器中选中要问的片段。</p><p id="chatState" class="status" aria-live="polite"></p><div id="chatMessages"></div><form id="chatForm"><label for="question">你的问题</label><textarea id="question" maxlength="2000" rows="4" placeholder="例如：我的这段循环为什么漏掉最后一个单词？" required></textarea><button id="send" class="primary">发送</button></form></section>
<details><summary>使用范围</summary><p>侧栏不增加网页按钮，不修改编辑器，不监听输入与提交，不运行或提交作业，不读写网站存储，也不自动清理缓存。首次使用或换到新标签页时，请点击浏览器工具栏的扩展图标授权读取。</p><p>本地即时检查先显示；模型分析在后台生成，完成时间取决于模型服务，不承诺完整答复五秒内完成。</p><p>如果发现多个编辑器，请明确选择代码来源：</p><label for="source">代码来源</label><input id="source" placeholder="通常留空；例如 ace:0"><p><a href="storage-transfer.html" target="_blank" rel="noopener">迁出旧插件数据</a></p></details>
<script src="vendor/marked/marked.umd.js"></script><script src="vendor/katex/katex.min.js"></script><script src="report-renderer.js"></script><script src="instant-hints.js"></script><script type="module" src="sidepanel.js"></script></body></html>
